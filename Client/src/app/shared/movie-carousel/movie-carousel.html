<div class="container px-20 mt-14 mb-20">
  <p class="font-semibold text-2xl my-3 ml-3">{{title}}</p>
  <div #swiperContainer class="swiper-container">
    <div class="swiper-wrapper">
      @if (movie$().value) {
        @for (movie of movie$().value; track $index) {
          <div (mouseenter)="setHoverMovie(movie)" (mouseleave)="clearHoverMovie()"  (click)="onClick(movie)"  class="swiper-slide">
            <img [src]="this.movieStreamService.getImageURL(movie.poster_path, 'w200')" alt="`{{movie.title}}" width="200" height="300"/>
            @if (movie.title === this.selectedContent) {
              <div class="desc p-2">
                <span class="text-base flex flex-wrap font-bold">{{movie.title}}</span>
                <p class="text-xs my-5">{{movie.admin_review}}</p>
                <div class="py-1 absolute w-[90%] bottom-1">
                  <p class="text-xs flex justify-between items-center">
                    <span class="text-green-500 ">Vote Average : {{movie.ranking.ranking_name}}</span>
                    <i class="fa fa-2x fa-chevron-circle-down" aria-hidden="true"></i>
                  </p>
                </div>
              </div>
            }
          </div>
        }
      } @else if (movie$().error) {

      }
      @else {

      }
    </div>
  </div>
</div>
